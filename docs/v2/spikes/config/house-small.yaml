palette:
  navy: '#22265F'
  heading_blue_declared: '#06436E'
  teal: '#549F99'
  running_head_orange: '#FF771C'
  subtitle_grey: '#666666'
  legend_navy: '#0F1340'
  rule_grey: '#A0A0A0'
  highlight_yellow: '#FFFF00'
  placeholder_red: '#FF0000'
fonts:
  body: Calibri
  title: Arial
  subtitle: Georgia
styles:
  normal:
    size_pt: 11
    color: '#000000'
    space_before_pt: 3
    space_after_pt: 6
    line_spacing: 1.15
  heading_1:
    size_pt: 16
    bold: true
    color: '#22265F'
    space_before_pt: 12
    space_after_pt: 0
    indent_start_pt: 0
    keep_with_next: true
  heading_2:
    size_pt: 14
    bold: false
    color: '#22265F'
    space_before_pt: 12
    space_after_pt: 0
    indent_start_pt: 0
    keep_with_next: true
  heading_3:
    size_pt: 12
    bold: false
    color: '#549F99'
    space_before_pt: 12
    space_after_pt: 6
    indent_start_pt: 0
    keep_with_next: true
  heading_4:
    size_pt: 11
    bold: true
    color: '#000000'
    space_before_pt: 12
    space_after_pt: 6
    indent_start_pt: 0
    keep_with_next: true
  heading_5:
    size_pt: 11
    bold: true
    italic: true
    color: '#000000'
    space_before_pt: 12
    space_after_pt: 6
    indent_start_pt: 0
  heading_6:
    size_pt: 11
    bold: true
    color: '#000000'
    space_before_pt: 12
    space_after_pt: 6
    indent_start_pt: 0
  title:
    size_pt: 16
    bold: true
    color: '#000000'
    font: Arial
    align: center
    space_before_pt: 12
    space_after_pt: 3
    line_spacing: 1.0
  subtitle:
    size_pt: 24
    italic: true
    color: '#666666'
    font: Georgia
    space_before_pt: 18
    space_after_pt: 4
    line_spacing: 1.15
    keep_with_next: true
    keep_lines_together: true
labels:
  version_control:
    text: Version Control
    bold: true
    size_pt: 12
    color: '#22265F'
    align: justify
    space_before_pt: 18
    space_after_pt: 0
  document_classification:
    text: Document Classification (Highlight as appropriate)
    bold: true
    size_pt: 12
    color: '#22265F'
    line_spacing: 1.0
    space_before_pt: 0
    space_after_pt: 0
  contents:
    text: Contents
    size_pt: 16
    color: '#22265F'
    space_before_pt: 24
    space_after_pt: 0
    keep_lines_together: true
cover:
  align: center
  lines:
  - text: 'Altery Group '
    size_pt: 29
    bold: true
    space_before_pt: 0
    space_after_pt: 0
  - text: ''
    size_pt: 29
    bold: true
    space_before_pt: 0
    space_after_pt: 0
  - size_pt: 29
    bold: true
    placeholder: title
    space_before_pt: 0
    space_after_pt: 0
    runs:
    - text: (Name of)
      highlight: yellow
    - text: ' '
    - text: Framework/Policy
      color: '#FF0000'
  - text: or
    size_pt: 29
    bold: true
    space_before_pt: 0
    space_after_pt: 0
  - size_pt: 29
    bold: true
    space_before_pt: 0
    space_after_pt: 0
    runs:
    - text: (Name of)
      highlight: yellow
    - text: ' '
    - text: Framework/Policy
      color: '#FF0000'
  - size_pt: 20
    placeholder: version
    runs:
    - text: 'Version: '
    - text: '1.0'
      highlight: yellow
  - text: May 2025
    size_pt: 20
    highlight: yellow
    placeholder: date
heading_numbering:
  mechanism: literal
  level1_format: '{n}-{title}'
  note: list numbering would renumber the ordinary paragraphs between headings
