# The Go suite is where the guard's guarantees live, so it runs on every push
# rather than when somebody remembers to run make test.
#
# The presence app is here too, built and never uploaded. release.yml runs on
# tags, and a tag is pushed by a person or at 02:00 UTC by the nightly, so a
# Swift file that does not compile would otherwise be found by the one build
# nobody is watching.
name: Go

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: gofmt
        run: cd go && test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: cd go && go vet ./...
      - name: test
        run: cd go && go test -race ./...
      # The installers' --desktop, which no Go test can reach: os/exec is banned
      # in every Go file under go/, so nothing in the suite can run a shell
      # script. This one runs both installers against fake binaries in temp
      # directories and compares the extension each wrote.
      - name: the desktop extension
        run: sh release/test-desktop.sh
      # The completion loader in a real shell, which no Go test can reach for
      # the same reason: it sources the loader in zsh and asks whether _gdoc is
      # a function. It skips itself where zsh is missing, so the step is only a
      # check on a runner that has one.
      - name: the completion loader
        run: sh release/test-completion.sh
      # Cross-compiling is a claim the Makefile makes and nobody working on
      # macOS can break safely. Running it here finds a windows-only build
      # failure on the commit that caused it.
      - name: dist
        run: make dist

      # The delivery platform is load-bearing for every milestone, and its one
      # gate before a merge is "the PR's checks are green". Both suites run no
      # model: every case is a dry run, a stub or a file read, so they cost a
      # second and no tokens. Without them here a regression in milestone.sh,
      # release.sh or meter.py reaches a green PR.
      - name: the platform and the team
        run: |
          make platform-test
          make team-check

  # The app, built the way the release builds it, minus the upload: nothing
  # downloads a push. The version is dev, which bundle.sh stamps 0.0.0, because
  # a push comes from no release and a plist that named one would be a bundle
  # the updater thinks it already installed.
  #
  # macos-26 carries Xcode 26.6 as its default, which is the version `swift
  # format lint` was written against; the path is selected by name anyway, so
  # the day the image's default moves is a failure here rather than a reformat
  # of somebody's pull request. The label and the Xcode were read off GitHub's
  # runner-images list on 2026-10-17.
  presence:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: the toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          swift --version

      - name: lint
        run: make app-lint

      - name: test
        run: make app-test

      # The out path is absolute because bundle.sh builds from its own
      # directory, which is why the Makefile passes one too.
      - name: the bundle
        run: presence/bundle.sh dev "$GITHUB_WORKSPACE/build/presence/GdocPresence.app"

      # A checkout build carries no release's version, and the one value that
      # says so is 0.0.0. bundle.sh fills the plist with sed, and a sed that
      # matched nothing exits 0, so the stamp is read back here as well.
      - name: the stamp is a checkout build
        run: |
          got="$(plutil -extract CFBundleShortVersionString raw -o - build/presence/GdocPresence.app/Contents/Info.plist)"
          if [ "$got" != "0.0.0" ]; then
            echo "A build from no release says CFBundleShortVersionString $got, and 0.0.0 is what no release means." >&2
            exit 1
          fi
          echo "the bundle carries $got"

      # The round trip the release's pack step does. It is proved on a Mac
      # because the ubuntu job that packs has no codesign at all.
      - name: the zip round trip keeps the signature
        run: |
          ( cd build/presence && zip -qr "$GITHUB_WORKSPACE/build/round-trip.zip" GdocPresence.app )
          mkdir -p build/round-trip
          unzip -q build/round-trip.zip -d build/round-trip
          codesign --verify --deep --strict build/round-trip/GdocPresence.app
          echo "the signature survives a zip and an unzip"
